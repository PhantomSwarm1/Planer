<!DOCTYPE html>
<html lang="sr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dnevni planer</title>
<style>
:root{--bg:#eef0f5;--col:#dfe3ec;--card:#fff;--text:#1b2232;--mut:#68718a;--line:#c8cedd;--acc:#2f6fed;--today:#d98e04;--ok:#1e9e68;--danger:#d64545;--r:10px;--red-bg:#ffd9d9;--red-fg:#5a1010;--yel-bg:#fff1b8;--yel-fg:#4a3800}
[data-theme=dark]{--bg:#11151e;--col:#1a2030;--card:#252d41;--text:#e8ebf4;--mut:#8d97b0;--line:#363f58;--acc:#6f9bff;--today:#f2b441;--ok:#44cf95;--danger:#ff7676;--red-bg:#7d2330;--red-fg:#ffeef0;--yel-bg:#78620f;--yel-fg:#fff8dc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.25rem;letter-spacing:-.01em;margin-right:auto}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--col);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--danger)}
.nav input,.nav select{background:var(--col);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.board{flex:1;display:flex;gap:14px;overflow-x:auto;padding:16px 18px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 292px;max-height:100%;display:flex;flex-direction:column;background:var(--col);border-radius:var(--r);border-top:4px solid var(--line);scroll-snap-align:start}
.col.today{border-top-color:var(--today)}
.col.over{outline:2px dashed var(--acc);outline-offset:-2px}
.ch{padding:10px 12px 8px}
.dn{font-weight:700;font-size:1.05rem}
.col.today .dn{color:var(--today)}
.dd{color:var(--mut);font-size:.85rem}
.prog{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut);margin-top:8px}
.col.complete .prog span:last-child{color:var(--ok);font-weight:600}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.list{overflow-y:auto;padding:4px 8px;min-height:44px;display:flex;flex-direction:column;gap:7px;flex:1}
.card{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:8px;padding:9px 10px;box-shadow:0 1px 2px rgba(0,0,0,.25);cursor:grab;border-left:3px solid transparent}
.card:hover{border-left-color:var(--acc)}
.card.drag{opacity:.35}
.chk{flex:0 0 20px;height:20px;margin-top:1px;border:2px solid var(--mut);border-radius:50%;background:none;padding:0;display:grid;place-items:center;font-size:12px;line-height:1;color:#fff}
.chk:hover{border-color:var(--ok)}
.ct{flex:1;min-width:0;cursor:pointer}
.title{overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:.78rem;display:flex;gap:10px;margin-top:2px}
.meta:empty{display:none}
.card.done{opacity:.6;border-left-color:var(--ok)}
.card.done .title{text-decoration:line-through;color:var(--mut)}
.card.done .chk{background:var(--ok);border-color:var(--ok)}
.add{display:flex;gap:6px;padding:8px}
.add input{flex:1;min-width:0;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:7px 9px}
.add input:focus{border-style:solid;border-color:var(--acc);background:var(--card)}
.add button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:0 12px}
/* boje kartica */
.card.c-red{background:var(--red-bg);color:var(--red-fg);border-left-color:#e5484d}
.card.c-yellow{background:var(--yel-bg);color:var(--yel-fg);border-left-color:#f2b441}
.card.c-red .meta,.card.c-yellow .meta{color:inherit;opacity:.8}
.card.c-red:not(.done) .chk,.card.c-yellow:not(.done) .chk{border-color:currentColor}
.card.c-red.done .title,.card.c-yellow.done .title{color:inherit}
.card.done.c-red,.card.done.c-yellow{border-left-color:var(--ok)}
.sw{display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .15s;padding-top:2px}
.card:hover .sw,.card:focus-within .sw{opacity:1}
@media (hover:none){.sw{opacity:1}}
.sw button{width:12px;height:12px;border-radius:50%;padding:0;border:2px solid var(--mut);background:transparent}
.sw .s-red{background:#e5484d;border-color:#e5484d}
.sw .s-yellow{background:#f2b441;border-color:#f2b441}
.sw button.on{outline:2px solid currentColor;outline-offset:1px}
.colpick,.wdays,.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets{margin-top:8px}
.colpick button,.wdays button,.presets button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.wdays button{min-width:46px;padding:6px 0}
.colpick button.on,.wdays button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.colpick .r.on{background:#e5484d;border-color:#e5484d}
.colpick .y.on{background:#f2b441;border-color:#f2b441;color:#2b2100}
#mrep{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px 12px 12px;margin-top:10px}
.hint{color:var(--mut);font-size:.82rem;margin:8px 0 0}
dialog{width:min(560px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,8,15,.6)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh label{display:flex;gap:8px;align-items:center;cursor:pointer}
.mtitle{width:100%;font-size:1.25rem;font-weight:700;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;margin-bottom:8px}
.mtitle:hover,.mtitle:focus{border-color:var(--line)}
.fl{display:block;color:var(--mut);font-size:.85rem;margin:12px 0 4px}
dialog input[type=date],dialog textarea,.clnew{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
dialog input[type=date]{width:auto}
textarea{resize:vertical;min-height:110px}
.cli{display:flex;gap:8px;align-items:center;padding:4px 0}
.cli input[type=text]{flex:1;background:transparent;border:0;border-bottom:1px solid transparent;padding:3px 0}
.cli input[type=text]:focus{border-bottom-color:var(--acc)}
.cli.d input[type=text]{text-decoration:line-through;color:var(--mut)}
.cli button{background:none;border:0;color:var(--mut)}
.cli button:hover{color:var(--danger)}
.cf{display:flex;gap:8px;margin-top:6px}
.mf{display:flex;justify-content:space-between;margin-top:18px}
@media (max-width:640px){.col{flex-basis:84vw}header{padding:10px 12px}.board{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Dnevni planer</h1>
  <div class="nav">
    <button class="btn" data-nav="-7" title="Sedmicu unazad">«</button>
    <button class="btn" data-nav="-1" title="Dan unazad">‹</button>
    <button class="btn pri" data-nav="today">Danas</button>
    <button class="btn" data-nav="tomorrow">Sutra</button>
    <button class="btn" data-nav="1" title="Dan naprijed">›</button>
    <button class="btn" data-nav="7" title="Sedmicu naprijed">»</button>
    <input type="date" id="jump" aria-label="Idi na datum">
    <select id="span" aria-label="Broj dana">
      <option value="3">3 dana</option><option value="5">5 dana</option><option value="7">7 dana</option><option value="14">14 dana</option>
    </select>
    <button class="btn" id="theme" title="Tamna / svijetla tema">Tema</button>
  </div>
</header>
<main class="board" id="board"></main>

<dialog id="dlg">
  <div class="mh">
    <label><input type="checkbox" id="mdone"> Završeno</label>
    <button class="btn" id="mclose" aria-label="Zatvori">✕</button>
  </div>
  <input class="mtitle" id="mtitle" maxlength="200" aria-label="Naslov zadatka">
  <label class="fl" for="mdate">Dan</label>
  <input type="date" id="mdate">
  <label class="fl">Boja / prioritet</label>
  <div class="colpick" id="mcolor">
    <button type="button" data-col="">Bez boje</button>
    <button type="button" data-col="red" class="r">🔴 Hitno</button>
    <button type="button" data-col="yellow" class="y">🟡 Ponavljati</button>
  </div>
  <div id="mrep" hidden>
    <label class="fl">Ponavlja se u dane</label>
    <div class="wdays" id="mwd">
      <button type="button" data-d="1">Pon</button><button type="button" data-d="2">Uto</button><button type="button" data-d="3">Sri</button><button type="button" data-d="4">Čet</button><button type="button" data-d="5">Pet</button><button type="button" data-d="6">Sub</button><button type="button" data-d="0">Ned</button>
    </div>
    <div class="presets">
      <button type="button" data-p="all">Svaki dan</button><button type="button" data-p="work">Radni dani</button><button type="button" data-p="none">Očisti</button>
    </div>
    <p class="hint">Kad ga označiš kao završenog, ostaje u istoriji na tom danu, a novi se odmah pojavljuje na sljedećem izabranom danu.</p>
  </div>
  <label class="fl" for="mnotes">Napomene</label>
  <textarea id="mnotes" placeholder="Opis, detalji, linkovi, zabilješke…"></textarea>
  <label class="fl">Checklista <span id="mprog"></span></label>
  <div id="mcl"></div>
  <form class="cf" id="mclform">
    <input class="clnew" id="mclnew" placeholder="Nova stavka" maxlength="200">
    <button class="btn">Dodaj</button>
  </form>
  <div class="mf">
    <button class="btn danger" id="mdel">Obriši zadatak</button>
    <button class="btn pri" id="mok">Gotovo</button>
  </div>
</dialog>

<script>
(() => {
  const KEY = 'dnevni-planer-v1';
  const WD = ['Nedjelja','Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak','Subota'];
  const MO = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
  const $ = s => document.querySelector(s);
  const board = $('#board'), dlg = $('#dlg');
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate()+n); return key(d); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => key(new Date());

  const S = { tasks: {}, theme: matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark', span: 7, start: today() };
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (d.tasks) S.tasks = d.tasks;
      if (d.theme) S.theme = d.theme;
      if (d.span) S.span = d.span;
    } catch (e) { console.warn('Učitavanje nije uspjelo', e); }
  }
  function save() {
    for (const k in S.tasks) if (!S.tasks[k].length) delete S.tasks[k];
    try { localStorage.setItem(KEY, JSON.stringify({ tasks: S.tasks, theme: S.theme, span: S.span })); }
    catch (e) { console.warn('Čuvanje nije uspjelo', e); }
  }
  function find(id) {
    for (const day in S.tasks) {
      const i = S.tasks[day].findIndex(t => t.id === id);
      if (i > -1) return { day, i, t: S.tasks[day][i] };
    }
  }

  const short = k => { const d = parse(k); return `${WD[d.getDay()].slice(0, 3)}, ${d.getDate()}. ${MO[d.getMonth()]}`; };

  // Nezavršeni zadaci iz prošlih dana prelaze na današnji dan; završeni ostaju na danu kad su urađeni
  function rollover() {
    const t = today(), carried = [];
    Object.keys(S.tasks).filter(d => d < t).sort().forEach(day => {
      const keep = [];
      S.tasks[day].forEach(task => {
        if (task.done) keep.push(task);
        else { task.origin = task.origin || day; carried.push(task); }
      });
      S.tasks[day] = keep;
    });
    if (!carried.length) return false;
    S.tasks[t] = carried.concat(S.tasks[t] || []);
    save();
    return true;
  }

  const WS = ['Ned','Pon','Uto','Sri','Čet','Pet','Sub'];
  const COLS = [['', 'Bez boje'], ['red', 'Hitno'], ['yellow', 'Ponavljanje']];
  const isRepeat = t => t.color === 'yellow' && t.repeat && t.repeat.length > 0;
  const repLabel = r => {
    if (r.length === 7) return 'svaki dan';
    if ([1,2,3,4,5].every(d => r.includes(d)) && r.length === 5) return 'radni dani';
    return [1,2,3,4,5,6,0].filter(d => r.includes(d)).map(d => WS[d]).join(', ');
  };
  const swatches = t => `<div class="sw">${COLS.map(([c, n]) =>
    `<button data-act="color" data-col="${c}" class="s-${c || 'none'} ${(t.color || '') === c ? 'on' : ''}" title="${n}" aria-label="${n}"></button>`).join('')}</div>`;
  function nextRepeatDay(from, days) {
    for (let i = 1; i <= 7; i++) { const k = addDays(from, i); if (days.includes(parse(k).getDay())) return k; }
  }
  // Označavanje završenog; ponavljajući zadatak odmah dobija novi primjerak na sljedećem izabranom danu
  function setDone(id, val) {
    const { day, t } = find(id);
    t.done = val;
    if (val && isRepeat(t) && !t.spawned) {
      const k = nextRepeatDay(day, t.repeat);
      const n = { id: uid(), title: t.title, notes: t.notes || '', done: false, color: 'yellow', repeat: [...t.repeat],
        checklist: (t.checklist || []).map(c => ({ id: uid(), text: c.text, done: false })) };
      (S.tasks[k] ||= []).push(n); t.spawned = n.id;
    } else if (!val && t.spawned) {
      const r = find(t.spawned);
      if (r && !r.t.done) S.tasks[r.day].splice(r.i, 1);
      t.spawned = null;
    }
  }

  function cardHTML(t, day) {
    const cl = t.checklist || [], cd = cl.filter(c => c.done).length;
    const meta = (t.origin && t.origin !== day ? `<span title="Prebačeno sa ranijeg dana">↪ od ${short(t.origin)}</span>` : '')
      + (isRepeat(t) ? `<span title="Ponavlja se">🔁 ${repLabel(t.repeat)}</span>` : '') + (t.notes ? '<span title="Ima napomene">📝 napomena</span>' : '') + (cl.length ? `<span>☑ ${cd}/${cl.length}</span>` : '');
    return `<div class="card ${t.done ? 'done' : ''} ${t.color ? 'c-' + t.color : ''}" draggable="true" data-id="${t.id}">
      <button class="chk" data-act="toggle" aria-label="Označi kao završeno" aria-pressed="${!!t.done}">${t.done ? '✓' : ''}</button>
      <div class="ct" data-act="open" tabindex="0" role="button"><div class="title">${esc(t.title)}</div><div class="meta">${meta}</div></div>${swatches(t)}
    </div>`;
  }
  function render() {
    const focusDay = document.activeElement && document.activeElement.closest('.add') ? document.activeElement.closest('.add').dataset.day : null;
    board.innerHTML = '';
    for (let i = 0; i < S.span; i++) {
      const k = addDays(S.start, i), list = S.tasks[k] || [];
      const done = list.filter(t => t.done).length, pct = list.length ? Math.round(done / list.length * 100) : 0;
      const d = parse(k);
      const col = document.createElement('section');
      col.className = 'col' + (k === today() ? ' today' : '') + (list.length && done === list.length ? ' complete' : '');
      col.dataset.day = k;
      col.innerHTML = `<div class="ch">
          <div class="dn">${WD[d.getDay()]}</div><div class="dd">${d.getDate()}. ${MO[d.getMonth()]} ${d.getFullYear()}.</div>
          <div class="prog"><span>${list.length ? `${done}/${list.length} urađeno` : 'Nema zadataka'}</span><span>${list.length ? pct + '%' : ''}</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
        <div class="list">${list.map(t => cardHTML(t, k)).join('')}</div>
        <form class="add" data-day="${k}"><input placeholder="Novi zadatak…" maxlength="200" aria-label="Novi zadatak za ${k}"><button aria-label="Dodaj">+</button></form>`;
      board.appendChild(col);
    }
    $('#jump').value = S.start;
    $('#span').value = S.span;
  }

  // Navigacija
  document.querySelector('.nav').addEventListener('click', e => {
    const b = e.target.closest('[data-nav]'); if (!b) return;
    const v = b.dataset.nav;
    S.start = v === 'today' ? today() : v === 'tomorrow' ? addDays(today(), 1) : addDays(S.start, +v);
    render();
  });
  $('#jump').addEventListener('change', e => { if (e.target.value) { S.start = e.target.value; render(); } });
  $('#span').addEventListener('change', e => { S.span = +e.target.value; save(); render(); });
  function applyTheme() { document.documentElement.dataset.theme = S.theme; }
  $('#theme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); });

  // Dodavanje zadatka
  board.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.closest('.add'); if (!f) return;
    const inp = f.querySelector('input'), title = inp.value.trim();
    if (!title) return;
    (S.tasks[f.dataset.day] ||= []).push({ id: uid(), title, notes: '', done: false, checklist: [] });
    save(); render();
    board.querySelector(`.add[data-day="${f.dataset.day}"] input`).focus();
  });

  // Klik na karticu: završi / otvori
  board.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const id = a.closest('.card').dataset.id;
    if (a.dataset.act === 'toggle') { setDone(id, !find(id).t.done); rollover(); save(); render(); }
    else if (a.dataset.act === 'color') {
      const t = find(id).t; t.color = a.dataset.col; save(); render();
      if (t.color === 'yellow' && !(t.repeat && t.repeat.length)) openTask(id); // odmah zadaj dane ponavljanja
    } else openTask(id);
  });
  board.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset.act === 'open') openTask(e.target.closest('.card').dataset.id);
  });

  // Drag & drop (premještanje između dana i promjena redoslijeda)
  let dragEl = null;
  board.addEventListener('dragstart', e => {
    const c = e.target.closest('.card'); if (!c) return;
    dragEl = c; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', c.dataset.id);
    setTimeout(() => c.classList.add('drag'), 0);
  });
  board.addEventListener('dragover', e => {
    if (!dragEl) return;
    const col = e.target.closest('.col'); if (!col) return;
    e.preventDefault();
    board.querySelectorAll('.col.over').forEach(c => c !== col && c.classList.remove('over'));
    col.classList.add('over');
    const list = col.querySelector('.list');
    const after = [...list.querySelectorAll('.card:not(.drag)')].find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    after ? list.insertBefore(dragEl, after) : list.appendChild(dragEl);
  });
  board.addEventListener('drop', e => e.preventDefault());
  board.addEventListener('dragend', () => {
    if (!dragEl) return;
    const map = {};
    Object.values(S.tasks).flat().forEach(t => map[t.id] = t);
    board.querySelectorAll('.col').forEach(c => { S.tasks[c.dataset.day] = [...c.querySelectorAll('.card')].map(el => map[el.dataset.id]); });
    dragEl = null; rollover(); save(); render();
  });

  // Detalji zadatka (modal)
  let cur = null;
  function renderCL() {
    const cl = find(cur).t.checklist ||= [];
    $('#mcl').innerHTML = cl.map(c => `<div class="cli ${c.done ? 'd' : ''}" data-cid="${c.id}">
      <input type="checkbox" ${c.done ? 'checked' : ''} aria-label="Gotovo">
      <input type="text" value="${esc(c.text)}" aria-label="Stavka"><button data-del aria-label="Obriši stavku">✕</button></div>`).join('');
    const d = cl.filter(c => c.done).length;
    $('#mprog').textContent = cl.length ? `(${d}/${cl.length})` : '';
  }
  function openTask(id) {
    cur = id; const { day, t } = find(id);
    $('#mdone').checked = !!t.done; $('#mtitle').value = t.title; $('#mdate').value = day; $('#mnotes').value = t.notes || '';
    renderCL(); syncColor(); dlg.showModal();
  }
  function syncColor() {
    const t = find(cur).t;
    $('#mcolor').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.col === (t.color || '')));
    $('#mrep').hidden = t.color !== 'yellow';
    $('#mwd').querySelectorAll('button').forEach(b => b.classList.toggle('on', (t.repeat || []).includes(+b.dataset.d)));
  }
  $('#mcolor').addEventListener('click', e => {
    const b = e.target.closest('[data-col]'); if (!b) return;
    find(cur).t.color = b.dataset.col; save(); syncColor();
  });
  $('#mrep').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const t = find(cur).t; let r = t.repeat || [];
    if (b.dataset.d !== undefined) { const d = +b.dataset.d; r = r.includes(d) ? r.filter(x => x !== d) : [...r, d]; }
    else r = b.dataset.p === 'all' ? [0,1,2,3,4,5,6] : b.dataset.p === 'work' ? [1,2,3,4,5] : [];
    t.repeat = r; save(); syncColor();
  });
  $('#mdone').addEventListener('change', e => { setDone(cur, e.target.checked); save(); });
  $('#mtitle').addEventListener('input', e => { find(cur).t.title = e.target.value; save(); });
  $('#mnotes').addEventListener('input', e => { find(cur).t.notes = e.target.value; save(); });
  $('#mdate').addEventListener('change', e => {
    if (!e.target.value) return;
    const { day, i, t } = find(cur);
    S.tasks[day].splice(i, 1);
    (S.tasks[e.target.value] ||= []).push(t); save();
  });
  $('#mclform').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('#mclnew').value.trim(); if (!text) return;
    (find(cur).t.checklist ||= []).push({ id: uid(), text, done: false });
    $('#mclnew').value = ''; save(); renderCL();
  });
  $('#mcl').addEventListener('change', e => {
    if (e.target.type !== 'checkbox') return;
    const cid = e.target.closest('.cli').dataset.cid;
    find(cur).t.checklist.find(c => c.id === cid).done = e.target.checked; save(); renderCL();
  });
  $('#mcl').addEventListener('input', e => {
    if (e.target.type !== 'text') return;
    const cid = e.target.closest('.cli').dataset.cid;
    find(cur).t.checklist.find(c => c.id === cid).text = e.target.value; save();
  });
  $('#mcl').addEventListener('click', e => {
    if (!e.target.matches('[data-del]')) return;
    const cid = e.target.closest('.cli').dataset.cid, t = find(cur).t;
    t.checklist = t.checklist.filter(c => c.id !== cid); save(); renderCL();
  });
  $('#mdel').addEventListener('click', () => {
    if (!confirm('Obrisati ovaj zadatak?')) return;
    const { day, i } = find(cur); S.tasks[day].splice(i, 1); save(); cur = null; dlg.close();
  });
  $('#mclose').addEventListener('click', () => dlg.close());
  $('#mok').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    if (cur) { const r = find(cur); if (r && !r.t.title.trim()) { r.t.title = 'Bez naslova'; save(); } }
    cur = null; rollover(); render();
  });

  // Sinhronizacija između otvorenih tabova
  addEventListener('storage', e => { if (e.key === KEY && !dlg.open) { load(); applyTheme(); render(); } });

  // Provjera promjene dana (ponoć) i povratka na tab
  let lastDay = today();
  function tick() {
    if (dlg.open) return;
    const n = today(), moved = rollover();
    if (n !== lastDay) { if (S.start === lastDay) S.start = n; lastDay = n; render(); }
    else if (moved) render();
  }
  setInterval(tick, 60000);
  addEventListener('focus', tick);
  document.addEventListener('visibilitychange', tick);

  load(); rollover(); applyTheme(); render();
})();
</script>
</body>
</html>
